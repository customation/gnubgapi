name: Build Native Libraries

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
    branches: [ master ]
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # A broken arm64 build should not withdraw the two that work.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            output-name: libgnubgapi.dll
          - os: ubuntu-latest
            rid: linux-x64
            output-name: libgnubgapi.so
          # arm64, built natively on GitHub's ARM runners — free here because
          # this repository is public. Every apt package the Linux build needs
          # exists for arm64, and the build differences in native/build.sh were
          # always ELF-versus-PE rather than x86-versus-ARM. This is what an
          # Apple Silicon gnubg needs first: a gnubg that compiles for ARM at
          # all, proven on hardware we can get today rather than after an Apple
          # developer account arrives.
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            output-name: libgnubgapi.so
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Do not let actions/checkout fetch submodules — it shallow-clones
        # with --depth 1, which only resolves objects reachable from the
        # registered branch's current tip. Our gnubg submodule is pinned
        # to a commit that upstream master has since moved past, so the
        # shallow fetch fails to land the pinned object. Fetch it
        # explicitly below with full depth instead.

      - name: Initialise gnubg submodule (full depth)
        shell: bash
        run: |
          git submodule init
          git submodule update --recursive

      # --- Windows (MSYS2/MinGW64) ---
      # `patch` and `git` are NOT optional and are not always present in the
      # MINGW64 environment: patch applies the visibility patch, git reports the
      # gnubg revision and restores eval.c afterwards. Their absence is what broke
      # this job for two months, disguised as a gnubg source-drift error.
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-pkg-config
            autoconf
            automake
            libtool
            make
            patch
            git
            gettext-devel
            bison
            flex

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd native
          GNUBGAPI_TARGET=${{ matrix.rid }} ./build.sh "$(pwd)/_out"

      # --- Linux ---
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgmp-dev libtool automake autoconf bison flex pkg-config gettext

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cd native
          GNUBGAPI_TARGET=${{ matrix.rid }} ./build.sh "$(pwd)/_out"

      # --- Upload ---
      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: native/_out/${{ matrix.output-name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Release assets are named per RID. linux-x64 and linux-arm64 both build a
      # file called libgnubgapi.so, and a release cannot hold two assets with one
      # name — uploading both would silently publish whichever landed last, for
      # the wrong architecture. The RID goes in the asset name; fetch-natives.ps1
      # puts it back under the plain name inside runtimes/<rid>/native/.
      - name: Name the assets by runtime
        run: |
          mkdir -p release
          cp artifacts/native-win-x64/libgnubgapi.dll     release/libgnubgapi-win-x64.dll
          cp artifacts/native-linux-x64/libgnubgapi.so    release/libgnubgapi-linux-x64.so
          cp artifacts/native-linux-arm64/libgnubgapi.so  release/libgnubgapi-linux-arm64.so
          ls -l release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/libgnubgapi-win-x64.dll
            release/libgnubgapi-linux-x64.so
            release/libgnubgapi-linux-arm64.so
