name: Publish NuGet Package (GitHub Packages)

on:
  workflow_dispatch:
    inputs:
      version_prefix:
        description: "Major.Minor version prefix (e.g. 0.1)"
        required: false
        default: "0.1"
      gnubg_tag:
        description: "gnubg release tag for native binaries (e.g. v0.1.0)"
        required: false
        default: "latest"
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - '.github/workflows/publish-package.yml'

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION_PREFIX: ${{ github.event.inputs.version_prefix || '0.1' }}
  GNUBG_TAG: ${{ github.event.inputs.gnubg_tag || 'latest' }}
  CONFIGURATION: Release
  DOTNET_VERSION: '10.0.x'

jobs:
  pack-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download native binaries from gnubg release
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="gnubg"
          mkdir -p runtimes/win-x64/native runtimes/linux-x64/native

          if [ "$GNUBG_TAG" = "latest" ]; then
            API_URL="https://api.github.com/repos/${OWNER}/${REPO}/releases/latest"
          else
            API_URL="https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${GNUBG_TAG}"
          fi

          echo "Fetching release info from $API_URL"
          RELEASE_JSON=$(curl -sL "$API_URL")

          DLL_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "libgnubgapi.dll") | .browser_download_url')
          SO_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "libgnubgapi.so") | .browser_download_url')

          if [ -n "$DLL_URL" ] && [ "$DLL_URL" != "null" ]; then
            echo "Downloading $DLL_URL"
            curl -sL -o runtimes/win-x64/native/libgnubgapi.dll "$DLL_URL"
          else
            echo "::warning::libgnubgapi.dll not found in release"
          fi

          if [ -n "$SO_URL" ] && [ "$SO_URL" != "null" ]; then
            echo "Downloading $SO_URL"
            curl -sL -o runtimes/linux-x64/native/libgnubgapi.so "$SO_URL"
          else
            echo "::warning::libgnubgapi.so not found in release"
          fi

          echo "=== Native binaries ==="
          find runtimes -type f -ls

      - name: Compute version
        run: |
          VERSION="${VERSION_PREFIX}.${GITHUB_RUN_NUMBER}"
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Package version: $VERSION"

      - name: Create nuget.config
        run: |
          cat > nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="github" value="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github>
                <add key="Username" value="${{ github.repository_owner }}" />
                <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
              </github>
            </packageSourceCredentials>
          </configuration>
          EOF

      - name: Pack
        run: |
          dotnet pack src/GammonBase.GnuBgApi/GammonBase.GnuBgApi.csproj \
            -c $CONFIGURATION \
            -p:PackageVersion=$PACKAGE_VERSION \
            -p:ContinuousIntegrationBuild=true \
            -o artifacts
          ls -la artifacts/

      - name: Push to GitHub Packages
        run: |
          for nupkg in artifacts/*.nupkg; do
            echo "Pushing $nupkg"
            dotnet nuget push "$nupkg" \
              --source "github" \
              --api-key ${{ secrets.GITHUB_TOKEN }} \
              --skip-duplicate
          done

      - name: Summary
        run: |
          echo "Published version: $PACKAGE_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Native binaries included:" >> $GITHUB_STEP_SUMMARY
          find runtimes -type f -name '*.dll' -o -name '*.so' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
